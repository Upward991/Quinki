<!doctype html>
<html><head><meta charset="utf-8"><title>Quinki</title>
<style>
  html,body{margin:0;height:100%;background:#08080b;color:#e6e6ea;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .card{width:360px;display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid #2a2a33;border-radius:12px;background:#0f0f13}
  img{width:64px;height:64px;display:block;margin:0 auto}
  .t{font-size:18px;font-weight:600;text-align:center}
  .s{font-size:13px;color:#9a9aa5;text-align:center;margin-bottom:4px}
  label{font-size:12px;color:#9a9aa5}
  input{background:#08080b;border:1px solid #2a2a33;border-radius:8px;color:#e6e6ea;font-size:14px;padding:9px 12px;outline:none}
  input:focus{border-color:#9d8bd9}
  button{margin-top:4px;padding:9px 16px;border:1px solid #9d8bd9;border-radius:8px;background:transparent;color:#9d8bd9;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:#9d8bd9;color:#08080b}
  .err{color:#e05561;font-size:12px;min-height:16px}
</style></head>
<body><div class="wrap"><div class="card">
  <img src="quinki-logo.png" alt="">
  <div class="t">Connect to Quinki</div>
  <div class="s">Paste the link and token from your Quinki server<br>(Settings &rarr; Remote access)</div>
  <label>Link</label><input id="link" placeholder="https://your-quinki.ts.net" spellcheck="false">
  <label>Token</label><input id="token" placeholder="token" spellcheck="false">
  <button id="go">Connect</button><div class="err" id="err"></div>
</div></div>
<script>
  var q = (window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
  document.getElementById('go').onclick = async function(){
    var link = document.getElementById('link').value.trim().replace(/\/+$/,'');
    var token = document.getElementById('token').value.trim();
    if (!link || !token) { document.getElementById('err').textContent = 'Link and token are required.'; return; }
    try { await q.invoke('shell_connect', { link: link, token: token }); } catch(e){ document.getElementById('err').textContent = String(e); }
  };
</script>
</body></html>
