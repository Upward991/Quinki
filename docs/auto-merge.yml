# auto-merge.yml — QUINKI MARKET: validazione + merge automatico delle PR.
name: Auto-merge valid packages

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate structure
        shell: bash
        run: |
          FAIL=0
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          for f in $FILES; do
            case "$f" in
              packages/tabs/*|packages/agents/*|packages/skills/*|packages/mcp/*|packages/themes/*|catalog.json) ;;
              *) echo "FORBIDDEN: $f"; FAIL=1 ;;
            esac
          done
          if [ "$FAIL" = "1" ]; then echo "::error::PR touches forbidden files"; exit 1; fi

      - name: Static scan
        shell: bash
        run: |
          FAIL=0
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          for f in $FILES; do
            if grep -qE "eval\(|child_process|exec\(|process\.env|fs\.(writeFile|rm|unlink)" "$f" 2>/dev/null; then
              echo "DANGEROUS pattern in $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then echo "::error::dangerous patterns found"; exit 1; fi

      - name: Secret scan
        shell: bash
        run: |
          FAIL=0
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          for f in $FILES; do
            if grep -qE "ghp_[A-Za-z0-9]{36,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY" "$f" 2>/dev/null; then
              echo "SECRET detected in $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then echo "::error::secrets found"; exit 1; fi

      - name: VirusTotal scan
        shell: bash
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VT_KEY" ]; then
            echo "::error::VIRUSTOTAL_API_KEY secret is not set in the repo settings"
            exit 1
          fi
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          FAILED=0
          COUNT=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            # VirusTotal serve per CONTENUTI ESECUTIBILI/binari: i file testo
            # (.md/.json/...) sono già coperti dallo scan statico + segreti.
            case "$f" in
              *.md|*.json|*.txt|*.yml|*.yaml|*.html|*.css|*.csv) echo "SKIP text: $f"; continue ;;
            esac
            COUNT=$((COUNT+1))
            ID=""
            for ATTEMPT in 1 2 3; do
              RESP=$(curl -s --max-time 30 -X POST "https://www.virustotal.com/api/v3/files" -H "x-apikey: $VT_KEY" -F "file=@$f")
              ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('id',''))" 2>/dev/null || echo "")
              if [ -n "$ID" ]; then break; fi
              sleep 8
            done
            if [ -z "$ID" ]; then
              echo "::error::VirusTotal upload failed for $f after retries (check the API key / quota)"
              exit 1
            fi
            sleep 15
            R=$(curl -s --max-time 30 "https://www.virustotal.com/api/v3/analyses/$ID" -H "x-apikey: $VT_KEY")
            MAL=$(echo "$R" | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('data',{}).get('attributes',{}).get('stats',{}); print(s.get('malicious',0))" 2>/dev/null || echo "0")
            if [ "$MAL" != "0" ]; then echo "VirusTotal: $f has $MAL detections"; FAILED=1; fi
          done
          if [ "$FAILED" = "1" ]; then echo "::error::VirusTotal found threats"; exit 1; fi
          echo "VirusTotal ok ($COUNT files)" 

      - name: Auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --admin
